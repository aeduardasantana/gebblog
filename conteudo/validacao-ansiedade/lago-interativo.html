<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font:16px/1.5 system-ui;color:#244358}.experience{border-radius:20px;background:#f0f7f8;padding:clamp(14px,3vw,24px);text-align:center}.experience h2{margin:0 0 8px;font-size:1.3rem}.experience p{margin:0 0 14px;color:#466472}.water{position:relative;height:290px;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 48% 38%,#d4f4f3 0%,#91cdd5 65%,#6fb2c0 100%);touch-action:none;cursor:crosshair;isolation:isolate;box-shadow:inset 0 0 50px #ffffff77}.water:focus-visible{outline:3px solid #256f8c;outline-offset:3px}.water:before{content:"";position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 16px,#ffffff1b 18px 20px,transparent 23px 46px);opacity:.6;animation:drift 10s ease-in-out infinite alternate;pointer-events:none}.ripple{position:absolute;left:var(--x);top:var(--y);width:45px;height:45px;transform:translate(-50%,-50%) scale(.15);border:3px solid rgba(255,255,255,.95);border-radius:50%;box-shadow:0 0 0 7px #e3ffff70,inset 0 0 12px #ffffffb0;animation:spread 2.8s ease-out forwards;pointer-events:none}.ripple:after{content:"";position:absolute;inset:-17px;border:2px solid #ffffffa0;border-radius:50%}.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#315a69;font-weight:500}.center span{background:#ffffffcf;border-radius:50px;padding:9px 15px;backdrop-filter:blur(4px)}.quiet{font-size:.9rem;color:#536f7a;margin-top:12px!important}@keyframes spread{to{opacity:0;transform:translate(-50%,-50%) scale(7)}}@keyframes drift{to{transform:translate(4%,2%)}}@media(prefers-reduced-motion:reduce){.water:before{animation:none}.ripple{animation:none;transform:translate(-50%,-50%) scale(1.7);opacity:.8}}</style></head><body><section class="experience" aria-label="Momento de tranquilidade"><h2>Um instante só seu</h2><p>Deslize o dedo ou o mouse sobre a água e acompanhe as ondas.</p><div class="water" id="water" role="button" tabindex="0" aria-label="Deslize ou toque para criar ondas visíveis sobre a água"><div class="center"><span id="message">Desenhe ondas na água</span></div></div><p class="quiet">Sem perguntas e sem pressa. Apenas observe o movimento, se for agradável para você.</p></section><script>(()=>{const water=document.getElementById("water"),message=document.getElementById("message");let last=0,n=0;const phrases=["Um momento de cada vez.","Pode ir no seu ritmo.","Apenas este instante.","Sem pressa."];function ripple(x,y){const el=document.createElement("span");el.className="ripple";el.style.setProperty("--x",x+"%");el.style.setProperty("--y",y+"%");water.append(el);setTimeout(()=>el.remove(),3000);message.textContent=phrases[n++%phrases.length]}function at(e){const r=water.getBoundingClientRect();ripple(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)))}water.addEventListener("pointerdown",e=>{water.setPointerCapture(e.pointerId);at(e);last=performance.now()});water.addEventListener("pointermove",e=>{if(e.buttons!==1&&e.pointerType!=="touch")return;const now=performance.now();if(now-last>90){at(e);last=now}});water.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();ripple(50,50)}});const send=()=>parent.postMessage({gebFrameHeight:Math.ceil(document.documentElement.scrollHeight+12)},"*");new ResizeObserver(send).observe(document.body);send()})();</script></html>
