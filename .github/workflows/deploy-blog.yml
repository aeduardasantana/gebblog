name: Blog GEB — Produção

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Garantir arquivo original da marca
        run: |
          mkdir -p assets
          if [ ! -s assets/geb-blog-logo.webp ]; then
            curl -fL --retry 3 'https://raw.githubusercontent.com/aeduardasantana/grupoeduardabispo/main/blog/assets/geb-blog-logo.webp' -o assets/geb-blog-logo.webp
          fi
          test -s assets/geb-blog-logo.webp
      - name: Publicar em /public_html/blog
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/blog/"
          options: '--exclude-glob .git/** --exclude-glob .github/** --exclude-glob README.md'
