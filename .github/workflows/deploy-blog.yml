name: Blog GEB — Produção

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'artigo.html'
      - 'assets/**'
      - 'conteudo/**'
      - 'shopping/**'
      - 'api.php'
      - '.htaccess'
      - 'robots.txt'
      - 'sitemap.xml'
      - '404.html'
      - 'mapa-do-site/**'
      - '.github/workflows/deploy-blog.yml'

concurrency:
  group: blog-geb-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pre-deploy SEO audit
        env:
          SITE_DIR: "."
        run: |
          python3 - <<'PY'
          import os, pathlib, json, re, sys, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ["SITE_DIR"])
          errors=[]
          files={name:root/name for name in ("index.html","404.html","mapa-do-site/index.html","robots.txt","sitemap.xml")}
          for name,p in files.items():
              if not p.is_file() or not p.stat().st_size: errors.append("Missing or empty: "+str(p))
          if files["index.html"].is_file():
              html=files["index.html"].read_text(encoding="utf-8").lower()
              for token in ('lang="pt-br"','<title','name="description"','rel="canonical"'):
                  if token not in html: errors.append("Home missing "+token)
              if re.search(r'<meta[^>]+name="robots"[^>]+noindex',html): errors.append("Home blocked by noindex")
              for blob in re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',html,re.S):
                  try: json.loads(blob)
                  except ValueError: errors.append("Invalid JSON-LD")
          if files["robots.txt"].is_file():
              robots=files["robots.txt"].read_text(encoding="utf-8")
              if not re.search(r'^Sitemap:\s*https://',robots,re.I|re.M): errors.append("robots.txt needs sitemap declaration")
              if re.search(r'^Disallow:\s*/\s*$',robots,re.I|re.M): errors.append("robots.txt blocks all")
          if files["sitemap.xml"].is_file():
              try:
                  tree=ET.parse(files["sitemap.xml"])
                  locs=[(e.text or "").strip() for e in tree.iter() if e.tag.rsplit("}",1)[-1]=="loc"]
                  if not locs or len(locs)!=len(set(locs)) or any(not u.startswith("https://") for u in locs): errors.append("Invalid, empty or duplicated sitemap URLs")
              except ET.ParseError: errors.append("Malformed sitemap XML")
          if files["404.html"].is_file() and "noindex" not in files["404.html"].read_text(encoding="utf-8").lower(): errors.append("404 page missing noindex")
          for error in errors: print("::error::"+error)
          if errors: sys.exit(1)
          print("Pre-deploy SEO checks passed")
          PY
      - name: Reconstruir manifesto e sitemap completos
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path("conteudo/indices")
          records={}
          for path in sorted(root.glob("lote-*.json"))+[root/"legado.json"]:
              if not path.is_file(): continue
              for item in json.loads(path.read_text(encoding="utf-8")):
                  if item.get("status")=="Publicado" and item.get("slug") and item.get("arquivo"):
                      records[item["slug"]]=item
          if not records: raise SystemExit("Acervo vazio; deploy bloqueado")
          articles=sorted(records.values(),key=lambda x:x.get("dataPublicacaoISO",""),reverse=True)
          (root/"manifesto-completo.json").write_text(json.dumps(articles,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          ET.register_namespace("","http://www.sitemaps.org/schemas/sitemap/0.9")
          ns="{http://www.sitemaps.org/schemas/sitemap/0.9}"
          urlset=ET.Element(ns+"urlset")
          for path in ["/","/mapa-do-site/"]+["/artigo/"+a["slug"]+"/" for a in articles]:
              ET.SubElement(ET.SubElement(urlset,ns+"url"),ns+"loc").text="https://blog.grupoeduardabispo.com.br"+path
          ET.ElementTree(urlset).write("sitemap.xml",encoding="utf-8",xml_declaration=True)
          print("Manifesto e sitemap gerados:",len(articles),"artigos")
          PY
      - name: Gerar HTML de artigos
        run: python3 scripts/gerar-paginas-estaticas.py
      - name: Garantir arquivo original da marca
        run: |
          mkdir -p assets
          if [ ! -s assets/geb-blog-logo.webp ]; then
            curl -fL --retry 3 'https://raw.githubusercontent.com/aeduardasantana/grupoeduardabispo/main/blog/assets/geb-blog-logo.webp' -o assets/geb-blog-logo.webp
          fi
          test -s assets/geb-blog-logo.webp
      - name: Publicar em /public_html/blog
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/blog/"
          options: '--exclude-glob .git/** --exclude-glob .github/** --exclude-glob README.md'
      - name: Verificar URLs publicas apos deploy
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, time, urllib.request
          base = "https://blog.grupoeduardabispo.com.br"
          shards = sorted(pathlib.Path("conteudo/indices").glob("lote-*.json"))
          if not shards:
              raise SystemExit("Nenhum indice de artigos encontrado")
          latest = shards[-1]
          expected = json.loads(latest.read_text(encoding="utf-8"))
          if not expected:
              raise SystemExit("Indice mais recente vazio")
          def fetch(path):
              req = urllib.request.Request(base + path, headers={"User-Agent":"GEB-Deploy-Audit/1.0", "Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  body=r.read()
                  if r.status != 200 or not body:
                      raise ValueError(path + " indisponivel ou vazio")
                  return body, r.headers.get("Content-Type", "")
          error = None
          for attempt in range(1, 5):
              try:
                  remote = json.loads(fetch("/conteudo/indices/" + latest.name)[0].decode("utf-8"))
                  found = {a.get("slug"):a for a in remote}
                  for item in expected:
                      slug=item["slug"]
                      if slug not in found:
                          raise ValueError("Artigo ausente do indice publico: " + slug)
                      path="/conteudo/" + item["arquivo"].lstrip("./")
                      article=json.loads(fetch(path)[0].decode("utf-8"))
                      if article.get("slug") != slug or article.get("status") != "Publicado" or not article.get("conteudoHTML"):
                          raise ValueError("JSON do artigo incompleto: " + slug)
                      page,ctype=fetch("/artigo/" + slug + "/")
                      if "html" not in ctype.lower() or b"<html" not in page.lower():
                          raise ValueError("Pagina publica nao e HTML valido: " + slug)
                  print("Smoke test OK: " + str(len(expected)) + " artigos do " + latest.name + " + URLs publicas.")
                  error=None
                  break
              except Exception as ex:
                  error=str(ex)
                  print("Tentativa " + str(attempt) + "/4: " + error)
                  if attempt < 4:
                      time.sleep(15)
          if error:
              print("::error::Deploy FTP executado, mas URL publica nao foi comprovada: " + error)
              sys.exit(1)
          PY
# Deploy solicitado para publicar catálogo Saúde com datas editoriais preservadas — 2026-10-13
