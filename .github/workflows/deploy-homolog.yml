name: Blog GEB — Homologação

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-homolog.yml'
      - 'index.html'
      - 'artigo.html'
      - 'assets/styles.css'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Garantir arquivo original da marca
        run: |
          mkdir -p assets
          if [ ! -s assets/geb-blog-logo.webp ]; then
            curl -fL --retry 3 'https://raw.githubusercontent.com/aeduardasantana/grupoeduardabispo/main/blog/assets/geb-blog-logo.webp' -o assets/geb-blog-logo.webp
          fi
          test -s assets/geb-blog-logo.webp
      - name: Impedir indexação de homologação
        run: |
          printf '\nHeader always set X-Robots-Tag "noindex, nofollow, noarchive"\nErrorDocument 404 /homolog/404.html\n' >> .htaccess
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
      - name: Publicar em /public_html/homolog
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/homolog/"
          options: '--exclude-glob .git/** --exclude-glob .github/** --exclude-glob README.md'
