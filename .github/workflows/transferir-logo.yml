name: Completar migração do arquivo binário

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/transferir-logo.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transferir imagem original do blog
        run: |
          mkdir -p assets
          curl -fL --retry 3 'https://raw.githubusercontent.com/aeduardasantana/grupoeduardabispo/main/blog/assets/geb-blog-logo.webp' -o assets/geb-blog-logo.webp
          test -s assets/geb-blog-logo.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/geb-blog-logo.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Migra logo binário original do Blog GEB'
            git pull --rebase origin main
            git push origin main
          fi
